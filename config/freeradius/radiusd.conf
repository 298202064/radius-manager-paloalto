# FreeRADIUS main configuration
prefix = /usr
exec_prefix = /usr
sysconfdir = /etc
localstatedir = /var
sbindir = /usr/sbin
logdir = /var/log/freeradius
raddbdir = /etc/freeradius
radacctdir = /var/log/freeradius/radacct

name = freeradius
confdir = ${raddbdir}
modconfdir = ${confdir}/mods-config
certdir = ${raddbdir}/certs
cadir = ${raddbdir}/certs
run_dir = /var/run/freeradius

# Logging
log {
    destination = files
    file = ${logdir}/radius.log
    syslog_facility = daemon
    stripped_names = no
    auth = yes
    auth_badpass = yes
    auth_goodpass = yes
    msg_goodpass = "Authentication OK"
    msg_badpass = "Authentication FAILED"
}

# Request/Reply logging
detail {
    detailfile = "${radacctdir}/%{%{Packet-Src-IP-Address}:-%{Packet-Src-IPv6-Address}}/detail-%Y%m%d"
    detailperm = 0600
    dirperm = 0750
    locking = no
    log_packet_header = yes
}

# PID file
pidfile = /var/run/freeradius/freeradius.pid
max_request_time = 30
cleanup_delay = 5
max_requests = 4096
allow_vulnerable_openssl = no

# Modules
$INCLUDE mods-enabled/

# Sites
$INCLUDE sites-enabled/

# Policy
$INCLUDE policy.d/
